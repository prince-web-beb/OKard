# Reference only; not deployed. Configure project, registry image and security first.
# This service is a SECONDARY API host, not an automatic DNS failover.
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: okard-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/maxScale: '3'
    spec:
      containerConcurrency: 80
      containers:
        - image: REPLACE_WITH_REGISTRY_IMAGE_DIGEST
          ports:
            - containerPort: 8080
          resources:
            limits:
              memory: 512Mi
              cpu: '1'
          env:
            - name: NODE_ENV
              value: production
# Before production: private DB/storage, VPC, validated auth, IAM and secrets.
