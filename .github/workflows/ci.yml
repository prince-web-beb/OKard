name: OKard Foundation CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-build-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # TODO 00.1: commit a generated pnpm-lock.yaml from an online trusted runner
      # then replace --no-frozen-lockfile with --frozen-lockfile.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
